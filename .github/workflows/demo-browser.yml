name: Demo browser checks
on:
  push:
    branches: [audit/demo-contact-safety]
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.58.2 http-server@14.1.1
      - run: npx playwright install --with-deps chromium
      - name: Start local HTTP server
        run: npx http-server . -p 4173 -a 127.0.0.1 -s > /tmp/demo-http.log 2>&1 &
      - name: Run browser checks
        run: npx playwright test tests/demo.spec.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
